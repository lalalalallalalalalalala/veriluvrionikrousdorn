[workspace]
resolver = "2"
members = [
    "kernel",
    "account",
    "gui",
    "wm",
    "user/keys",
    "arch",
    "drivers",
    "console",
    "memory",
    "sched",
    "syscall",
    "vfs",
    "btrfs",
    "loader",
    "vch",
    "user/vlr-libc",
    "user/hello",
    "user/greet",
    "user/vch-bin",
    "xtask",
]
default-members = ["xtask"]

# The kernel target has no unwinder. Abort keeps every crate, including the
# host-side image builder, on the same panic strategy.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
