[package]
name = "vlr-memory"
version = "0.2.0"
edition = "2021"
publish = false
description = "Physical frame allocator, paging, and the kernel heap"

[dependencies]
linked_list_allocator = { version = "0.10", default-features = false }
spin = { version = "0.9.8", default-features = false, features = ["spin_mutex", "once"] }
x86_64 = { version = "0.15.2", default-features = false, features = ["instructions"] }
